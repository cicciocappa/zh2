# balance.cfg — parametri di gioco (attacco vs difesa), caricato a runtime.
#
# Formato: chiave = valore, una per riga; '#' commenta (anche a fine riga).
# Righe mancanti = valore di default compilato; chiavi ignote = warning a
# console e riga ignorata. Il file viene riletto a OGNI rebuild del mondo
# (quindi anche cambiando livello / R in sandbox): si può tarare senza
# ricompilare. Le env var VAT_HORDE_* continuano a vincere su questo file.
#
# I valori qui sotto SONO i default compilati (2026-07-15): questo file è la
# fotografia di partenza, modifica e prova.

# ---- nemici -----------------------------------------------------------
# hp = punti vita; speed = m/s preferiti; radius = raggio disco (m);
# mass = unità walker (il PBD usa i rapporti); heavy_hits = colpi di
# torretta pesante per smembrare (1 = normale).
enemy.obese.hp         = 160
enemy.obese.speed      = 1.1
enemy.obese.radius     = 0.34
enemy.obese.mass       = 1.6
enemy.obese.heavy_hits = 1

enemy.man.hp           = 100
enemy.man.speed        = 1.4
enemy.man.radius       = 0.30
enemy.man.mass         = 1.0
enemy.man.heavy_hits   = 1

enemy.woman.hp         = 80
enemy.woman.speed      = 1.5
enemy.woman.radius     = 0.27
enemy.woman.mass       = 0.85
enemy.woman.heavy_hits = 1

enemy.child.hp         = 50
enemy.child.speed      = 1.7
enemy.child.radius     = 0.22
enemy.child.mass       = 0.5
enemy.child.heavy_hits = 1

enemy.tank.hp          = 600
enemy.tank.speed       = 1.0
enemy.tank.radius      = 0.55
enemy.tank.mass        = 10.0
enemy.tank.heavy_hits  = 4

enemy.crawl_speed      = 0.35   # velocità dei crawler (gambe azzoppate)

# ---- gore (i cadaveri intasano i varchi) ------------------------------
gore.corpse_prob = 0.25         # prob. che un kill leggero lasci il corpo
gore.corpse_ttl  = 9.0          # s prima che il corpo sparisca

# ---- torrette (vale per piazzamento PREP e torrette di scena) ---------
# fire_period = s fra i colpi; damage = HP a colpo (heavy smembra, ignora
# damage); hp = vita della postazione; cost = $ budget PREP; mag = colpi
# per caricatore (0 = infinito); reload_cost = biomassa per la ricarica
# istantanea al click.
turret.light.range       = 40
turret.light.fire_period = 0.12
turret.light.damage      = 20
turret.light.arc_deg     = 90
turret.light.hp          = 600
turret.light.cost        = 100
turret.light.mag         = 40
turret.light.reload_cost = 25

turret.heavy.range       = 40
turret.heavy.fire_period = 2.5
turret.heavy.damage      = 0    # smembra: il danno non conta
turret.heavy.arc_deg     = 90
turret.heavy.hp          = 600
turret.heavy.cost        = 250
turret.heavy.mag         = 12
turret.heavy.reload_cost = 35

turret.flame.range       = 12
turret.flame.fire_period = 0.15
turret.flame.damage      = 6    # danno diretto per tick del getto
turret.flame.arc_deg     = 90
turret.flame.hp          = 600
turret.flame.cost        = 180
turret.flame.mag         = 30
turret.flame.reload_cost = 30
turret.flame.dot_dps     = 16   # fuoco addosso: HP/s
turret.flame.dot_dur     = 5    # durata dell'incendio (s)

turret.acid.range        = 18
turret.acid.fire_period  = 0.25
turret.acid.damage       = 4
turret.acid.arc_deg      = 90
turret.acid.hp           = 600
turret.acid.cost         = 220
turret.acid.mag          = 25
turret.acid.reload_cost  = 30
turret.acid.dot_dps      = 12
turret.acid.dot_dur      = 8

turret.reload_s          = 12   # finestra muta della ricarica automatica (s)

# ---- barriere e mine (catalogo PREP) ----------------------------------
barricade.cost = 12             # $ al modulo (strumento a linea)
barricade.hp   = 300
barricade.mass = 30             # massa dei detriti al crollo (0 = crollo pulito)
fence.cost     = 20             # cancellata: cover semi-trasparente
fence.hp       = 200
fence.mass     = 15
fence.opacity  = 0.3            # 0..1: le torrette sparano attraverso

mine.cost           = 40        # $ PREP
mine.trigger_radius = 1.2
mine.blast_radius   = 6
mine.damage         = 150
mine.strength       = 22        # spinta dell'esplosione
mine.up_ratio       = 0.6       # quota di lancio in aria
mine.arm_s          = 1.0       # s prima che si armi

# ---- mortaio (verbo M, costo in biomassa) -----------------------------
mortar.cost         = 40
mortar.delay        = 1.8       # tempo di volo (s)
mortar.min_range    = 12
mortar.max_range    = 90
mortar.cooldown     = 5         # s fra un colpo e l'altro
mortar.blast_radius = 8
mortar.blast_damage = 180
mortar.bio_yield    = 0.1       # resa biomassa dei kill da mortaio (1 = piena;
                                # l'esplosione POLVERIZZA la biomassa: niente farm)
mortar.fear         = 16        # sangue-paura timbrato al cratere (16 = 2x la
                                # saturazione: strada negata per ~30 s)
mortar.fear_radius  = 8         # raggio del timbro paura (m)

# ---- biomassa (economia dell'assalto) ---------------------------------
bio.cap         = 500           # capienza serbatoio (biotank di scena vince)
bio.repair_rate = 100           # RIPARA: HP/s a mantenimento (1 bio = 1 HP)
bio.adjust_cost = 0             # REGOLA: biomassa per riorientare (0 = gratis)
bio.build_markup = 1.5          # costruire in ASSALTO: prezzo bio = ceil(markup x costo $)
bio.yield.obese = 2             # resa per kill, per body
bio.yield.man   = 1
bio.yield.woman = 1
bio.yield.child = 1
bio.yield.tank  = 8

# ---- assedio (l'orda che sfonda) --------------------------------------
siege.attack_period = 0.8       # s fra i colpi di ogni agente che preme
siege.attack_damage = 25         # HP a colpo sulle strutture
siege.turret_dps    = 6        # HP/s per agente a contatto con una torretta
siege.turret_reach  = 2.0       # portata del morso oltre la postazione (m)
fear.blood_radius   = 0.7       # sangue→paura: raggio timbrato per morte (m)
fear.blood_weight   = 0.25      # peso per morte (~4 morti saturano la cella)
lure.weight         = -0.5      # richiamo da fuoco (>= 0 = spento)
lure.radius         = 6
lure.linger         = 2.5       # s di richiamo dopo l'ultimo colpo

# ---- director (spawn legacy; i rate delle exit stanno nel .scn) --------
director.base_rate   = 16       # nemici/s all'ondata 0
director.rate_ramp   = 8        # nemici/s in più per ondata
director.wave_period = 15       # s per ondata
director.tank_base   = 2        # % tank all'ondata 0
director.tank_ramp   = 2        # +% per ondata
director.tank_cap    = 15
director.obese_base  = 12
director.obese_ramp  = 2
director.obese_cap   = 30
director.man_pct     = 30       # fette fisse; child = resto
director.woman_pct   = 25

# ---- missione / varie --------------------------------------------------
game.budget      = 1000         # budget $ di PREP (il `budget` di scena vince)
game.lz_hp       = 500         # HP del nucleo LZ
game.fall_damage = 25           # danno all'atterraggio dopo un lancio in aria
